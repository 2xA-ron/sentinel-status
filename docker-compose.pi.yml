services:
  frontend:
    build:
      context: .
      dockerfile: deploy/pi/frontend.Dockerfile
    container_name: sentinelops-frontend
    environment:
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - VITE_API_BASE_URL=http://localhost:8080
      # SSR-only override: the frontend container reaches Cloud Run through the
      # nginx reverse proxy on this Docker network, not through localhost.
      - VITE_SSR_API_BASE_URL=http://nginx:8080
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy/pi/nginx
      dockerfile: Dockerfile
    container_name: sentinelops-nginx
    ports:
      - "8080:8080"
    depends_on:
      - frontend
    restart: unless-stopped

  # Cloudflare Tunnel — makes the dashboard accessible from the internet.
  # Quick tunnel (default): no account needed, gives you a *.trycloudflare.com URL.
  #   Get the URL with: docker compose -f docker-compose.pi.yml logs cloudflared | grep trycloudflare
  # Permanent tunnel: replace the command with:
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sentinelops-tunnel
    command: tunnel --no-autoupdate --url http://nginx:8080
    restart: unless-stopped
    depends_on:
      - nginx
