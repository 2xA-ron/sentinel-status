name: Deploy frontend (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate deployment secrets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$VITE_API_BASE_URL" ]]; then
            echo "::error::VITE_API_BASE_URL is missing. Add the deployed API URL as a repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add a scoped Cloudflare API token as a repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Add the Cloudflare account ID as a repository secret."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          # wrangler (^4.27.0, currently resolving to 4.123.x) requires Node >=22 —
          # this was pinned to 20 and failed every deploy with
          # "Wrangler requires at least Node.js v22.0.0".
          node-version: 22

      - run: npm ci

      - name: Build and deploy to Cloudflare
        run: npm run deploy:cloudflare
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
