events {
    worker_connections 1024;
}

http {
    # Frontend container
    upstream frontend {
        server frontend:3000;
    }

    # Cloud Run API backend
    upstream cloudrun_api {
        server sentinelops-api-pin2vchuja-uc.a.run.app:443;
    }

    server {
        listen 8080;
        server_name _;

        # Proxy API requests to Cloud Run
        location /api/ {
            proxy_pass https://cloudrun_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host sentinelops-api-pin2vchuja-uc.a.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_server_name on;
        }

        # Proxy SignalR hub to Cloud Run
        location /realtime {
            proxy_pass https://cloudrun_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host sentinelops-api-pin2vchuja-uc.a.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
        }

        # Proxy everything else to the frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            proxy_pass https://cloudrun_api/api/status;
            proxy_ssl_server_name on;
        }
    }
}
